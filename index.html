<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bullshit Messenger</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-viewport">

    <div id="join-screen" class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-icon">⚡</div>
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to sync your encrypted workspace</p>
        </div>

        <form id="auth-form" action="#">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="e.g. nikhil" autocomplete="username" required />
          </div>

          <div class="form-group">
            <label for="user-password">User Password</label>
            <input type="password" id="user-password" placeholder="••••••••" autocomplete="current-password" required />
          </div>

          <div class="form-group">
            <label for="room-code">Room Name</label>
            <input type="text" id="room-code" placeholder="e.g. general" required />
          </div>

          <div class="form-group">
            <label for="room-password">Room Password</label>
            <input type="password" id="room-password" placeholder="Room access key" required />
          </div>

          <div class="form-row remember-row">
            <label class="checkbox-label">
              <input type="checkbox" id="remember-me" checked />
              <span>Remember session</span>
            </label>
          </div>

          <button type="submit" id="join-btn" class="btn-primary full-width">Continue to Workspace</button>
        </form>

        <div id="recent-rooms-wrapper" class="recent-rooms-section hidden">
          <span class="recent-title">Recent Channels</span>
          <div id="recent-rooms-list" class="recent-tags"></div>
        </div>
      </div>
    </div>

    <div id="chat-screen" class="workspace-layout hidden">
      
      <aside id="sidebar" class="sidebar-panel">
        <div class="sidebar-header">
          <div class="workspace-info">
            <span class="workspace-icon">⚡</span>
            <span class="workspace-name">Pulse Workspace</span>
          </div>
          <button id="toggle-sidebar-btn" class="icon-btn-ghost mobile-only" type="button">✕</button>
        </div>

        <div class="sidebar-nav">
          <div class="nav-section-title">
            <span>CHANNELS</span>
            <button id="quick-add-room-btn" class="icon-btn-sm" title="Join/Create Room" type="button">+</button>
          </div>
          <div id="sidebar-rooms-list" class="room-nav-list">
            </div>
        </div>

        <div class="sidebar-user-footer">
          <div class="user-avatar" id="current-user-avatar">N</div>
          <div class="user-meta">
            <span id="current-user-display" class="user-name">User</span>
            <span class="user-status"><span class="status-dot"></span> Active</span>
          </div>
          <button id="logout-btn" class="icon-btn-ghost danger" title="Log Out" type="button">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </div>
      </aside>

      <main class="chat-viewport">
        
        <header class="top-bar">
          <div class="header-left">
            <button id="mobile-menu-btn" class="icon-btn-ghost mobile-only" type="button">
              <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="room-details">
              <h2 id="room-title" class="room-heading"># general</h2>
              <span class="badge-encrypted">
                <svg width="12" height="12" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
                End-to-End Encrypted
              </span>
            </div>
          </div>

          <div class="header-right">
            <button id="call-btn" class="icon-btn-secondary" title="Start Call" type="button">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"></path></svg>
              <span>Call</span>
            </button>
          </div>
        </header>

        <div id="messages-container" class="messages-feed"></div>

        <div id="reply-preview" class="reply-banner hidden">
          <div class="reply-banner-content">
            <span class="reply-label">Replying to <strong id="reply-user">User</strong></span>
            <p id="reply-text" class="reply-snippet">Message content snippet...</p>
          </div>
          <button id="cancel-reply" class="icon-btn-ghost" type="button">✕</button>
        </div>

        <footer class="chat-input-container">
          <div class="input-bar">
            <button id="ai-modal-btn" class="icon-btn-action" title="AI Assistant" type="button">✨</button>
            <input type="text" id="message-input" placeholder="Message channel... (@ai for bot)" autocomplete="off" />
            <button id="send-btn" class="btn-send" type="button">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </footer>

      </main>
    </div>

    <div id="ai-modal" class="modal-backdrop hidden">
      <div class="modal-box">
        <div class="modal-header">
          <div class="modal-title-group">
            <span>✨</span>
            <h3>Ask Neo AI</h3>
          </div>
          <button id="close-ai-modal" class="icon-btn-ghost" type="button">✕</button>
        </div>
        <p class="modal-desc">Type your query below. Neo AI will post its answer directly to this channel.</p>
        <textarea id="ai-prompt-input" placeholder="e.g. Summarize our conversation or explain WebSockets..." rows="3"></textarea>
        <div class="modal-footer">
          <button id="ai-submit-btn" class="btn-primary" type="button">Generate &amp; Post</button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
