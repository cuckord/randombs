<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pulse Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-shell">

    <div id="join-screen" class="auth-card">
      <div class="auth-header">
        <div class="brand-logo">💬</div>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Enter your credentials to access your workspace</p>
      </div>

      <form id="auth-form" action="#">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="e.g. nikhil" autocomplete="username" required />
        </div>

        <div class="form-group">
          <label for="user-password">User Password</label>
          <input type="password" id="user-password" placeholder="Account passcode" autocomplete="current-password" required />
        </div>

        <div class="form-group">
          <label for="room-code">Room Name</label>
          <input type="text" id="room-code" placeholder="e.g. general" required />
        </div>

        <div class="form-group">
          <label for="room-password">Room Password</label>
          <input type="password" id="room-password" placeholder="Room access key" required />
        </div>

        <div class="form-row remember-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" checked />
            <span>Remember Me</span>
          </label>
        </div>

        <button type="submit" id="join-btn" class="btn-primary">Continue to Chat</button>
      </form>

      <div id="recent-rooms-wrapper" class="recent-rooms-section hidden">
        <span class="recent-title">Recent Rooms</span>
        <div id="recent-rooms-list" class="recent-tags"></div>
      </div>
    </div>

    <div id="chat-screen" class="chat-wrapper hidden">
      
      <header class="chat-header">
        <div class="header-info">
          <h3 id="room-title" class="room-name"># general</h3>
          <div class="status-indicator">
            <span class="status-dot"></span>
            <span class="status-text">Encrypted Channel</span>
          </div>
        </div>

        <div class="header-actions">
          <button id="call-btn" class="icon-btn" title="Start Audio Call" type="button">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"></path></svg>
          </button>
          <button id="logout-btn" class="icon-btn danger" title="Log Out" type="button">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </div>
      </header>

      <main id="messages-container" class="messages-viewport"></main>

      <div id="reply-preview" class="reply-banner hidden">
        <div class="reply-banner-content">
          <span id="reply-user" class="reply-banner-user">User</span>
          <span id="reply-text" class="reply-banner-text">Message preview...</span>
        </div>
        <button id="cancel-reply" class="cancel-btn" type="button">✕</button>
      </div>

      <footer class="chat-footer">
        <button id="ai-modal-btn" class="action-btn ai-btn" title="Ask AI Assistant" type="button">
          ✨
        </button>
        
        <div class="input-wrapper">
          <input type="text" id="message-input" placeholder="Message #room..." autocomplete="off" />
        </div>

        <button id="send-btn" class="btn-primary send-btn" type="button">
          <span>Send</span>
        </button>
      </footer>

    </div>

    <div id="ai-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>✨ AI Assistant</h3>
          <button id="close-ai-modal" class="cancel-btn" type="button">✕</button>
        </div>
        <p class="modal-desc">Ask a quick question or prompt to generate a response in room.</p>
        <textarea id="ai-prompt-input" placeholder="Type your prompt here..." rows="3"></textarea>
        <div class="modal-actions">
          <button id="ai-submit-btn" class="btn-primary" type="button">Generate & Share</button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
