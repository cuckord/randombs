<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YAPPATRON — Realtime Messaging Platform</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-viewport">

    <div id="join-screen" class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-logo-icon">
            <i data-lucide="bot" class="icon-hero"></i>
          </div>
          <h1 class="auth-title">YAPPATRON</h1>
          <p class="auth-subtitle">Enter your credentials to start yapping</p>
        </div>

        <form id="auth-form" action="#" onsubmit="return false;">
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-icon-group">
              <i data-lucide="user" class="input-icon"></i>
              <input type="text" id="username" placeholder="e.g. nikhil" autocomplete="username" required />
            </div>
          </div>

          <div class="form-group">
            <label for="user-password">User Password</label>
            <div class="input-icon-group">
              <i data-lucide="lock" class="input-icon"></i>
              <input type="password" id="user-password" placeholder="••••••••" autocomplete="current-password" required />
            </div>
          </div>

          <div class="form-group">
            <label for="room-code">Yap Room</label>
            <div class="input-icon-group">
              <i data-lucide="hash" class="input-icon"></i>
              <input type="text" id="room-code" placeholder="e.g. general" required />
            </div>
          </div>

          <div class="form-group">
            <label for="room-password">Yap Key</label>
            <div class="input-icon-group">
              <i data-lucide="key" class="input-icon"></i>
              <input type="password" id="room-password" placeholder="Yap Room passcode" required />
            </div>
          </div>

          <div class="form-row remember-row">
            <label class="checkbox-label">
              <input type="checkbox" id="remember-me" checked />
              <span>Remember Session</span>
            </label>
          </div>

          <button type="submit" id="join-btn" class="btn-primary full-width">
            <i data-lucide="zap"></i>
            <span>Start Yapping</span>
          </button>
        </form>

        <div id="recent-rooms-wrapper" class="recent-rooms-section hidden">
          <span class="recent-title">Recent Yaps</span>
          <div id="recent-rooms-list" class="recent-tags"></div>
        </div>
      </div>
    </div>

    <div id="chat-screen" class="workspace-layout hidden">
      
      <aside id="sidebar" class="sidebar-panel">
        <div class="sidebar-header">
          <div class="workspace-brand">
            <i data-lucide="bot" class="brand-icon"></i>
            <span class="brand-name">YAPPATRON</span>
          </div>
          <button id="toggle-sidebar-btn" class="icon-btn-ghost mobile-only" type="button">
            <i data-lucide="x"></i>
          </button>
        </div>

        <div class="sidebar-content">
          <div class="sidebar-search">
            <div class="search-box">
              <i data-lucide="search" class="search-icon"></i>
              <input type="text" id="search-rooms-input" placeholder="Search Yaps..." />
            </div>
          </div>

          <div class="sidebar-nav">
            <div class="nav-section-header">
              <span>YAP ROOMS</span>
              <button id="quick-add-room-btn" class="icon-btn-xs" title="Join Yap Room" type="button">
                <i data-lucide="plus"></i>
              </button>
            </div>
            <div id="sidebar-rooms-list" class="room-nav-list"></div>
          </div>
        </div>

        <div class="sidebar-user-footer">
          <div class="user-avatar" id="current-user-avatar">N</div>
          <div class="user-meta">
            <span id="current-user-display" class="user-name">User</span>
            <span class="user-status"><span class="status-dot"></span> Online</span>
          </div>
          <button id="logout-btn" class="icon-btn-ghost danger" title="Stop Yapping" type="button">
            <i data-lucide="log-out"></i>
          </button>
        </div>
      </aside>

      <main class="chat-viewport">
        
        <header class="top-bar">
          <div class="header-left">
            <button id="mobile-menu-btn" class="icon-btn-ghost mobile-only" type="button">
              <i data-lucide="menu"></i>
            </button>
            <div class="room-details">
              <div class="room-title-row">
                <i data-lucide="hash" class="room-hash-icon"></i>
                <h2 id="room-title" class="room-heading">general</h2>
              </div>
              <span class="badge-encrypted">
                <i data-lucide="shield-check" class="badge-icon"></i>
                End-to-End Encrypted
              </span>
            </div>
          </div>

          <div class="header-right">
            <button id="call-btn" class="btn-secondary" title="Call the Yappers" type="button">
              <i data-lucide="phone"></i>
              <span>Call the Yappers</span>
            </button>
          </div>
        </header>

        <div class="messages-viewport-wrapper">
          <div id="messages-container" class="messages-feed"></div>
        </div>

        <div id="typing-indicator" class="typing-indicator-bar hidden">
          <i data-lucide="message-square" class="typing-icon"></i>
          <span>Someone is yapping...</span>
        </div>

        <div id="reply-preview" class="reply-banner hidden">
          <div class="reply-banner-content">
            <span class="reply-label">Replying to <strong id="reply-user">User</strong></span>
            <p id="reply-text" class="reply-snippet">Message content...</p>
          </div>
          <button id="cancel-reply" class="icon-btn-ghost" type="button">
            <i data-lucide="x"></i>
          </button>
        </div>

        <footer class="chat-input-container">
          <div class="input-bar">
            <button id="ai-modal-btn" class="icon-btn-action" title="YapBot Assistant" type="button">
              <i data-lucide="sparkles"></i>
            </button>
            <input type="text" id="message-input" placeholder="Type your next masterpiece..." autocomplete="off" />
            <button id="send-btn" class="btn-send" type="button">
              <i data-lucide="send"></i>
            </button>
          </div>
        </footer>

      </main>
    </div>

    <div id="ai-modal" class="modal-backdrop hidden">
      <div class="modal-box">
        <div class="modal-header">
          <div class="modal-title-group">
            <i data-lucide="bot" class="modal-bot-icon"></i>
            <h3>YapBot Assistant</h3>
          </div>
          <button id="close-ai-modal" class="icon-btn-ghost" type="button">
            <i data-lucide="x"></i>
          </button>
        </div>
        <p class="modal-desc">Ask YapBot a query. It will post its response directly into this Yap Room.</p>
        <textarea id="ai-prompt-input" placeholder="Ask YapBot anything..." rows="3"></textarea>
        <div class="modal-footer">
          <button id="ai-submit-btn" class="btn-primary" type="button">
            <i data-lucide="sparkles"></i>
            <span>Generate &amp; Post</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
