<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <div id="join-screen" class="card">
      <h2 class="app-title">Chat Room</h2>
      <p class="subtitle">Enter user & room credentials to continue</p>
      
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" required />
      </div>

      <div class="input-group">
        <label for="user-password">User Password</label>
        <input type="password" id="user-password" placeholder="Password to claim username" required />
      </div>

      <div class="input-group">
        <label for="room-code">Room Name</label>
        <input type="text" id="room-code" placeholder="e.g. main-room" required />
      </div>

      <div class="input-group">
        <label for="room-password">Room Password</label>
        <input type="password" id="room-password" placeholder="Room password" required />
      </div>

      <button id="join-btn">Enter Room</button>
    </div>

    <div id="chat-screen" class="card hidden">
      <div class="chat-header">
        <div>
          <h3 id="room-title">Room: -</h3>
          <span class="status-badge"><span class="dot"></span> Online</span>
        </div>
        <div style="display: flex; gap: 6px;">
          <button id="call-btn" class="secondary-btn">📞 Call</button>
          <button id="leave-btn" class="secondary-btn">Leave</button>
        </div>
      </div>

      <div id="messages-container" class="messages-container"></div>

      <div id="reply-preview" class="reply-preview hidden">
        <div>
          <span id="reply-user" class="reply-user">User</span>
          <span id="reply-text" class="reply-text">Message</span>
        </div>
        <button id="cancel-reply" class="cancel-reply-btn">✕</button>
      </div>

      <div class="chat-input-area">
        <input type="text" id="message-input" placeholder="Message... (@ai for bot)" />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
